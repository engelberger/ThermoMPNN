name: ph_prediction
project: thermompnn_ph

platform:
  thermompnn_dir: /media/iwe30/nvme/github/ThermoMPNN
  accel: cuda
  train_workers: 12
  val_workers: 12

data_loc:
  ph_dir: data/ph

model:
  hidden_dims: [128, 64, 32]
  num_final_layers: 3
  freeze_weights: true
  load_pretrained: true
  lightattn: true
  model_weights_path: vanilla_model_weights/v_48_020.pt

training:
  learn_rate: 1e-4
  mpnn_learn_rate: 1e-5
  epochs: 100
  lr_schedule: true
  
  # Training monitoring settings
  log_every_n_steps: 50
  plot_every_n_epochs: 1
  gradient_norm_logging: true
  activation_histograms: true
  monitor_save_dir: "training_plots" 